name: Trivy scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  trivy:
    name: Run Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p trivy-output

      - name: Run Trivy (fs) via Trivy Action — JSON
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-output/trivy-results.json'
          # Do not fail the job on vulnerabilities; we want to always upload artifacts
          exit-code: '0'

      - name: Run Trivy (fs) via Trivy Action — SARIF
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-output/trivy-results.sarif'
          exit-code: '0'

      - name: Upload JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results-json
          path: trivy-output/trivy-results.json

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results-sarif
          path: trivy-output/trivy-results.sarif

      # === CodeQL analysis ===
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Run CodeQL autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          output: codeql-output

      - name: Upload CodeQL SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results-sarif
          path: codeql-output
