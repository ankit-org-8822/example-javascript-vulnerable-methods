name: Trivy Monorepo Security

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover components
    runs-on: ubuntu-latest
    outputs:
      paths_json: ${{ steps.discover.outputs.paths_json }}
      docker_json: ${{ steps.discover.outputs.docker_json }}
    steps:
      - uses: actions/checkout@v4

      - id: discover
        name: Build matrices (apps/*, services/*)
        shell: bash
        run: |
          set -euo pipefail
          # Directories you consider "components" in your monorepo:
          ROOTS=("apps" "services" "packages")

          PATHS=()
          DOCKER=()

          for ROOT in "${ROOTS[@]}"; do
            if [[ -d "$ROOT" ]]; then
              while IFS= read -r -d '' d; do
                PATHS+=("$d")
                if [[ -f "$d/Dockerfile" ]]; then
                  DOCKER+=("$d")
                fi
              done < <(find "$ROOT" -mindepth 1 -maxdepth 1 -type d -print0)
            fi
          done

          # Always include repo root for top-level configs / IaC
          PATHS+=(".")

          jq -nc --argjson a "$(printf '%s\n' "${PATHS[@]}" | jq -R . | jq -s .)" \
                 --argjson b "$(printf '%s\n' "${DOCKER[@]}" | jq -R . | jq -s .)" \
                 '{paths:$a, docker:$b}' > matrices.json

          echo "paths_json=$(jq -c '.paths' matrices.json)" >> $GITHUB_OUTPUT
          echo "docker_json=$(jq -c '.docker' matrices.json)" >> $GITHUB_OUTPUT

  fs_secret_misconfig:
    name: FS/Secrets/Misconfig – ${{ matrix.path }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJson(needs.discover.outputs.paths_json) }}
    steps:
      - uses: actions/checkout@v4
      - id: sanitize
        name: Sanitize path for filenames
        run: |
          SANITIZED_PATH="${{ matrix.path }}"
          SANITIZED_PATH="${SANITIZED_PATH//\//-}"
          echo "sanitized_path=$SANITIZED_PATH" >> $GITHUB_OUTPUT

      - name: Trivy (fs + secrets + misconfig) → SARIF
        uses: aquasecurity/trivy-action@0.33.1   # replace with a pinned tag when you pick one
        with:
          scan-type: fs
          scan-ref: ${{ matrix.path }}
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-${{ steps.sanitize.outputs.sanitized_path }}.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          # Skip noisy dirs (adjust as needed)
          skip-dirs: .git,node_modules,dist,build,.next

      - name: Upload SARIF (fs)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ steps.sanitize.outputs.sanitized_path }}.sarif
          category: trivy-fs-${{ matrix.path }}

      - name: Upload Trivy FS SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-${{ steps.sanitize.outputs.sanitized_path }}
          path: trivy-${{ steps.sanitize.outputs.sanitized_path }}.sarif
          retention-days: 30

  image_scan:
    name: Image – ${{ matrix.dir }}
    needs: discover
    if: ${{ fromJson(needs.discover.outputs.docker_json)[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.docker_json) }}
    steps:
      - uses: actions/checkout@v4
      - id: build-image
        name: Build image
        run: |
          IMAGE_NAME=$(basename "${{ matrix.dir }}")
          IMAGE=monorepo/${IMAGE_NAME}:${{ github.sha }}
          docker build -t "$IMAGE" "${{ matrix.dir }}"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - id: sanitize-dir
        name: Sanitize dir for filenames
        run: |
          SANITIZED_DIR="${{ matrix.dir }}"
          SANITIZED_DIR="${SANITIZED_DIR//\//-}"
          echo "sanitized_dir=$SANITIZED_DIR" >> $GITHUB_OUTPUT

      - name: Trivy (image) → SARIF
        uses: aquasecurity/trivy-action@0.33.1   # replace with a pinned tag when you pick one
        with:
          image-ref: ${{ steps.build-image.outputs.image }}
          format: sarif
          output: trivy-image-${{ steps.sanitize-dir.outputs.sanitized_dir }}.sarif
          vuln-type: os,library
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload SARIF (image)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-${{ steps.sanitize-dir.outputs.sanitized_dir }}.sarif
          category: trivy-image-${{ matrix.dir }}

      - name: Upload Trivy Image SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-${{ steps.sanitize-dir.outputs.sanitized_dir }}
          path: trivy-image-${{ steps.sanitize-dir.outputs.sanitized_dir }}.sarif
          retention-days: 30

  bearer_scan:
    name: Bearer static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Bearer scan
        id: bearer_report
        uses: bearer/bearer-action@v2
        with:
          scanner: 'sast,secrets'
          format: 'sarif'
          output: 'bearer-report.sarif'
          exit-code: '0'

      - name: Upload Bearer SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bearer-report.sarif

      - name: Upload Bearer SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bearer-report-sarif
          path: bearer-report.sarif
          retention-days: 30
