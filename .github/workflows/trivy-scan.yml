name: Trivy Monorepo Security

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover components
    runs-on: ubuntu-latest
    outputs:
      paths_json: ${{ steps.discover.outputs.paths_json }}
      docker_json: ${{ steps.discover.outputs.docker_json }}
    steps:
      - uses: actions/checkout@v4

      - id: discover
        name: Build matrices (apps/*, services/*)
        shell: bash
        run: |
          set -euo pipefail
          # Directories you consider "components" in your monorepo:
          ROOTS=("apps" "services" "packages")

          PATHS=()
          DOCKER=()

          for ROOT in "${ROOTS[@]}"; do
            if [[ -d "$ROOT" ]]; then
              while IFS= read -r -d '' d; do
                PATHS+=("$d")
                if [[ -f "$d/Dockerfile" ]]; then
                  DOCKER+=("$d")
                fi
              done < <(find "$ROOT" -mindepth 1 -maxdepth 1 -type d -print0)
            fi
          done

          # Always include repo root for top-level configs / IaC
          PATHS+=(".")

          jq -nc --argjson a "$(printf '%s\n' "${PATHS[@]}" | jq -R . | jq -s .)" \
                 --argjson b "$(printf '%s\n' "${DOCKER[@]}" | jq -R . | jq -s .)" \
                 '{paths:$a, docker:$b}' > matrices.json

          echo "paths_json=$(jq -c '.paths' matrices.json)" >> $GITHUB_OUTPUT
          echo "docker_json=$(jq -c '.docker' matrices.json)" >> $GITHUB_OUTPUT

  fs_secret_misconfig:
    name: FS/Secrets/Misconfig – ${{ matrix.path }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJson(needs.discover.outputs.paths_json) }}
    steps:
      - uses: actions/checkout@v4

      - name: Trivy (fs + secrets + misconfig) → SARIF
        uses: aquasecurity/trivy-action@v0.33.1   # replace with a pinned tag when you pick one
        with:
          scan-type: fs
          scan-ref: ${{ matrix.path }}
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-${{ matrix.path//\//- }}.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          # Skip noisy dirs (adjust as needed)
          skip-dirs: .git,node_modules,dist,build,.next

      - name: Upload SARIF (fs)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.path//\//- }}.sarif
          category: trivy-fs-${{ matrix.path }}

  image_scan:
    name: Image – ${{ matrix.dir }}
    needs: discover
    if: ${{ fromJson(needs.discover.outputs.docker_json)[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.docker_json) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          IMAGE=monorepo/${{ matrix.dir##*/ }}:${{ github.sha }}
          docker build -t "$IMAGE" "${{ matrix.dir }}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Trivy (image) → SARIF
        uses: aquasecurity/trivy-action@v0.33.1   # replace with a pinned tag when you pick one
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-image-${{ matrix.dir//\//- }}.sarif
          vuln-type: os,library
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload SARIF (image)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-${{ matrix.dir//\//- }}.sarif
          category: trivy-image-${{ matrix.dir }}
