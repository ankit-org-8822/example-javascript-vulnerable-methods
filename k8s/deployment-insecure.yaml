apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-deployment
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: insecure
    spec:
      containers:
      - name: insecure-container
        image: node:14
        securityContext:
          privileged: true # insecure
        env:
        - name: SECRET_TOKEN
          value: "hardcoded-secret-token"
        volumeMounts:
        - name: host-volume
          mountPath: /host
      volumes:
      - name: host-volume
        hostPath:
          path: /
          type: Directory
